<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Tennis Analyzer</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🎾</text></svg>" />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="css/style.css" />

    <script src="https://cdnjs.cloudflare.com/ajax/libs/fflate/0.8.2/fflate.min.js"></script>
    <script src="https://sql.js.org/dist/sql-wasm.js"></script>

    <!-- 🔒 LOGIN-CHECK -->
    <script>
    (function() {
        // 🔥 HIER DEINE NUTZER MIT HASHES EINTRAGEN
        const USERS = {
            'admin':   'b367e9e143966ae9edb5ff9e579a30c74c97e7925ae23bf3c1b6fd201b159300',
            'lisa':  'HASH_VON_LISA_HIER',
            'tom':   'HASH_VON_TOM_HIER',
            'felix': 'HASH_VON_FELIX_HIER',
            'anna':  'HASH_VON_ANNA_HIER',
            'ben':   'HASH_VON_BEN_HIER',
            'julia': 'HASH_VON_JULIA_HIER',
            'paul':  'HASH_VON_PAUL_HIER',
            'sarah': 'HASH_VON_SARAH_HIER',
            'tim':   'HASH_VON_TIM_HIER'
        };

        // Session-Check
        if (sessionStorage.getItem('tennis_auth') === 'true') {
            window.__loggedIn = true;
            window.__user = sessionStorage.getItem('tennis_user');
            return;
        }

        window.__loggedIn = false;

        document.addEventListener('DOMContentLoaded', function() {
            const overlay = document.createElement('div');
            overlay.id = 'loginOverlay';
            overlay.style.cssText = `
                position: fixed;
                top: 0; left: 0; right: 0; bottom: 0;
                background: radial-gradient(circle at center, #0f1724 0%, #05080f 100%);
                display: flex;
                align-items: center;
                justify-content: center;
                z-index: 99999;
                font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            `;

            overlay.innerHTML = `
                <div style="
                    background: rgba(255,255,255,0.03);
                    border: 1px solid rgba(255,255,255,0.08);
                    border-radius: 20px;
                    padding: 40px 36px;
                    width: 360px;
                    backdrop-filter: blur(20px);
                    box-shadow: 0 20px 60px rgba(0,0,0,0.5);
                ">
                    <div style="text-align: center; margin-bottom: 28px;">
                        <div style="font-size: 52px; margin-bottom: 12px;">🎾</div>
                        <h1 style="color: #e0e6f0; font-size: 22px; font-weight: 700; margin: 0 0 6px 0;">Tennis Analyzer</h1>
                        <p style="color: #7a8aa3; font-size: 13px; margin: 0;">Privater Zugang</p>
                    </div>

                    <div style="margin-bottom: 16px;">
                        <label style="color: #7a8aa3; font-size: 11px; text-transform: uppercase; letter-spacing: 0.5px; display: block; margin-bottom: 6px;">Benutzername</label>
                        <input 
                            type="text" 
                            id="loginUser" 
                            placeholder="z.B. max"
                            autocomplete="username"
                            style="
                                width: 100%;
                                padding: 12px 14px;
                                border-radius: 10px;
                                border: 1px solid rgba(255,255,255,0.1);
                                background: #141b2b;
                                color: #e0e6f0;
                                font-size: 14px;
                                outline: none;
                                box-sizing: border-box;
                            "
                            onfocus="this.style.borderColor='rgba(46,204,113,0.5)'"
                            onblur="this.style.borderColor='rgba(255,255,255,0.1)'"
                        >
                    </div>

                    <div style="margin-bottom: 24px;">
                        <label style="color: #7a8aa3; font-size: 11px; text-transform: uppercase; letter-spacing: 0.5px; display: block; margin-bottom: 6px;">Passwort</label>
                        <input 
                            type="password" 
                            id="loginPass" 
                            placeholder="••••••••"
                            autocomplete="current-password"
                            style="
                                width: 100%;
                                padding: 12px 14px;
                                border-radius: 10px;
                                border: 1px solid rgba(255,255,255,0.1);
                                background: #141b2b;
                                color: #e0e6f0;
                                font-size: 14px;
                                outline: none;
                                box-sizing: border-box;
                            "
                            onfocus="this.style.borderColor='rgba(46,204,113,0.5)'"
                            onblur="this.style.borderColor='rgba(255,255,255,0.1)'"
                        >
                    </div>

                    <button 
                        id="loginBtn"
                        style="
                            width: 100%;
                            padding: 13px;
                            border-radius: 10px;
                            border: none;
                            background: linear-gradient(135deg, #2ecc71, #27ae60);
                            color: white;
                            font-size: 14px;
                            font-weight: 600;
                            cursor: pointer;
                            transition: transform 0.15s, box-shadow 0.15s;
                            box-shadow: 0 4px 14px rgba(46,204,113,0.3);
                        "
                        onmouseover="this.style.transform='translateY(-1px)';this.style.boxShadow='0 6px 18px rgba(46,204,113,0.4)'"
                        onmouseout="this.style.transform='translateY(0)';this.style.boxShadow='0 4px 14px rgba(46,204,113,0.3)'"
                    >
                        Anmelden
                    </button>

                    <div id="loginError" style="
                        color: #e74c3c;
                        font-size: 12px;
                        margin-top: 14px;
                        min-height: 16px;
                        text-align: center;
                    "></div>
                </div>
            `;

            document.body.appendChild(overlay);

            setTimeout(() => document.getElementById('loginUser').focus(), 100);

            overlay.addEventListener('keydown', function(e) {
                if (e.key === 'Enter') doLogin();
            });

            document.getElementById('loginBtn').addEventListener('click', doLogin);
        });

        window.doLogin = async function() {
            const user = document.getElementById('loginUser').value.trim().toLowerCase();
            const pw = document.getElementById('loginPass').value;
            const err = document.getElementById('loginError');

            if (!user || !pw) {
                err.textContent = '⚠️ Bitte alle Felder ausfüllen';
                return;
            }

            if (!USERS[user]) {
                err.textContent = '❌ Unbekannter Benutzer';
                document.getElementById('loginPass').value = '';
                return;
            }

            const buf = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(pw));
            const hash = Array.from(new Uint8Array(buf)).map(b => b.toString(16).padStart(2, '0')).join('');

            if (hash === USERS[user]) {
                sessionStorage.setItem('tennis_auth', 'true');
                sessionStorage.setItem('tennis_user', user);
                window.__loggedIn = true;
                window.__user = user;

                document.getElementById('loginOverlay').style.display = 'none';
                console.log('✅ Eingeloggt als:', user);

                loadAppScripts();
            } else {
                err.textContent = '❌ Falsches Passwort';
                document.getElementById('loginPass').value = '';
                document.getElementById('loginPass').focus();
            }
        };

        function loadAppScripts() {
            const modules = [
                'js/modules/sidebar.js',
                'js/modules/ranking.js',
                'js/modules/players.js',
                'js/modules/analyse.js',
                'js/modules/h2h.js',
                'js/modules/dashboard.js',
                'js/modules/match_predictor.js',
                'js/app.js'
            ];

            let loaded = 0;
            modules.forEach(function(src) {
                const script = document.createElement('script');
                script.src = src;
                script.defer = true;
                script.onload = function() {
                    loaded++;
                    if (loaded === modules.length) {
                        setTimeout(function() {
                            const event = new Event('DOMContentLoaded');
                            document.dispatchEvent(event);
                            console.log('🚀 App gestartet');
                        }, 100);
                    }
                };
                document.head.appendChild(script);
            });
        }
    })();
    </script>
</head>
<body>
    <div class="main">
        <h1 id="pageTitle">🎾 ATP <span class="highlight">Weltrangliste</span></h1>
        <div class="content-container" id="pageContent">
            <div class="loading">🔒 Bitte anmelden...</div>
        </div>
    </div>
</body>
</html>
